<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELVORA - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">ÉLVORA</div>
    <ul class="nav-links">
        <li><a href="home.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
    </ul>
    <div class="nav-icons">
        <a href="#" id="search-btn" class="icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="7" stroke="#C2567A" stroke-width="2"/>
                <line x1="16" y1="16" x2="22" y2="22" stroke="#C2567A" stroke-width="2"/>
            </svg>
        </a>
        <a href="wishlist.html" class="icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M12 21s-6-4.35-9-8.5C-1 8 1 3 5 3c2.54 0 4 1.5 4 1.5S10.46 3 13 3c4 0 6 5 2 9.5C18 16.65 12 21 12 21z"
                      stroke="#C2567A" stroke-width="2" fill="none"/>
            </svg>
        </a>
        <a href="#" id="profile-btn" class="icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" stroke="#C2567A" stroke-width="2"/>
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7" stroke="#C2567A" stroke-width="2" fill="none"/>
            </svg>
        </a>
        <a href="cart.html" class="icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="9" cy="21" r="1" stroke="#C2567A" stroke-width="2"/>
                <circle cx="20" cy="21" r="1" stroke="#C2567A" stroke-width="2"/>
                <path d="M1 1h4l2.5 13a2 2 0 0 0 2 1.5h10a2 2 0 0 0 2-1.5L23 6H6"
                      stroke="#C2567A" stroke-width="2" fill="none"/>
            </svg>
        </a>
    </div>
</nav>

<!-- Search Modal -->
<div id="search-panel" class="search-modal" aria-label="Search panel">
    <span class="close-btn" id="search-close">&times;</span>
    <div class="search-modal-content">
        <input id="search-input" type="text" placeholder="Search products, categories...">
        <button id="search-submit" class="btn">Search</button>
    </div>
</div>

<!-- Profile Modal -->
<div id="profile-panel" class="search-modal" aria-label="Profile panel">
    <span class="close-btn" id="profile-close">&times;</span>
    <div class="search-modal-content">
        <h2>Your Account</h2>
        <a href="myaccount.html" class="btn">My Account</a>
        <a href="myorders.html" class="btn">Orders</a>
        <a href="wishlist.html" class="btn">Wishlist</a>
        <button class="btn" onclick="logoutUser()">Logout</button>
    </div>
</div>

<div class="container">
    <h2 class="section-title">My Cart</h2>
    <div id="cart-container"></div>
    <div id="empty-cart" class="empty-state" style="display: none;">
        <h3>Your cart is empty</h3>
        <p>Add items you love to your cart and checkout here.</p>
        <a href="shop.html" class="btn">Start Shopping</a>
    </div>
    <div id="cart-total" class="cart-total"></div>
    <div id="checkout-panel" class="checkout-panel hidden">
        <div class="checkout-summary">
            <h3>Order Summary</h3>
            <p id="subtotal-text">Subtotal: ₹0</p>
            <p id="shipping-text">Shipping: ₹99</p>
            <h4 id="total-text">Total: ₹0</h4>
            <div class="payment-options">
                <h3>Choose Payment Method</h3>
                <div class="payment-method">
                    <input type="radio" id="online-payment" name="payment-method" value="online" checked>
                    <label for="online-payment">💳 Online Payment (Mock)</label>
                </div>
                <div class="payment-method">
                    <input type="radio" id="cod-payment" name="payment-method" value="cod">
                    <label for="cod-payment">💵 Cash on Delivery</label>
                </div>
            </div>
            <button class="btn" onclick="placeOrder()">Place Order</button>
        </div>
        <div class="checkout-info">
            <h3>Shipping Information</h3>
            <label>Name<input id="customer-name" type="text" placeholder="Full name"></label>
            <label>Email<input id="customer-email" type="email" placeholder="Email address"></label>
            <label>Address<input id="customer-address" type="text" placeholder="Street address"></label>
            <label>City<input id="customer-city" type="text" placeholder="City"></label>
            <label>ZIP / Postal Code<input id="customer-zip" type="text" placeholder="Postal code"></label>
        </div>
    </div>
</div>

<script>
// ─── Modal functionality ───────────────────────────────────────────────────
const searchBtn    = document.getElementById('search-btn');
const profileBtn   = document.getElementById('profile-btn');
const searchPanel  = document.getElementById('search-panel');
const profilePanel = document.getElementById('profile-panel');
const searchClose  = document.getElementById('search-close');
const profileClose = document.getElementById('profile-close');

searchBtn.addEventListener('click',  e => { e.preventDefault(); searchPanel.style.display  = 'flex'; });
profileBtn.addEventListener('click', e => { e.preventDefault(); profilePanel.style.display = 'flex'; });
searchClose.addEventListener('click',  () => { searchPanel.style.display  = 'none'; });
profileClose.addEventListener('click', () => { profilePanel.style.display = 'none'; });

window.addEventListener('click', e => {
    if (e.target === searchPanel)  searchPanel.style.display  = 'none';
    if (e.target === profilePanel) profilePanel.style.display = 'none';
});


// ─── PRODUCTS DATA ─────────────────────────────────────────────────────────
const productsData = {
    dress1: { title: "Elegant Pink Feather Dress", price: "₹1,299", images: ["images/shop-dress-01.jpg"] },
    dress2: { title: "Soft Pink Corset Dress", price: "₹1,499", images: ["images/dress2.jpg.jpg"] },
    dress3: { title: "Bodycon Dress", price: "₹1,799", images: ["images/dress3.jpg.jpg"] },
    dress4: { title: "Summer Frill Dress", price: "₹1,099", images: ["images/shop-dress-02.jpg"] },

    top1: { title: "White Ruffle Top", price: "₹799", images: ["images/top1.jpg.jpg"] },
    top2: { title: "Pink Satin Top", price: "₹899", images: ["images/top2.jpg.jpg"] },
    top3: { title: "Off-Shoulder Top", price: "₹999", images: ["images/top3.jpg.jpg"] },
    top4: { title: "Floral Puff Sleeve Top", price: "₹899", images: ["images/top4.jpg.jpg"] },

    winter1: { title: "White CO OD Set", price: "₹2,499", images: ["images/top&bottom.jpg.jpg"] },
    winter2: { title: "Skirt And Cardigan Set", price: "₹1,499", images: ["images/top&bottom2.jpg.jpg"] },

    trending1: { title: "Beige Wool Coat", price: "₹1,499", images: ["images/trend1.jpg.jpg"] }
};


// ─── CART FUNCTIONS ────────────────────────────────────────────────────────
function getCart() {
    const cart = localStorage.getItem('elvora_cart');
    return cart ? JSON.parse(cart) : [];
}

function saveCart(cart) {
    localStorage.setItem('elvora_cart', JSON.stringify(cart));
}

// ✅ FIXED REMOVE FUNCTION
function removeFromCart(uid) {
    let cart = getCart();

    cart = cart.filter(item => item.uid !== uid);

    saveCart(cart);
    displayCart();
}


// ─── DISPLAY CART ──────────────────────────────────────────────────────────
function displayCart() {
    const cart = getCart();
    const container = document.getElementById('cart-container');
    const emptyState = document.getElementById('empty-cart');
    const cartTotal = document.getElementById('cart-total');
    const checkoutPanel = document.getElementById('checkout-panel');

    if (cart.length === 0) {
        emptyState.style.display = 'block';
        container.innerHTML = '';
        cartTotal.innerHTML = '';
        checkoutPanel.classList.add('hidden');
        return;
    }

    emptyState.style.display = 'none';

    let totalPrice = 0;
    const shippingCost = 99;

    const grid = document.createElement('div');
    grid.className = 'shop-grid';

    cart.forEach((item, index) => {
        const product = productsData[item.id];

        if (!product) return;

        const priceNum = Number(product.price.replace('₹','').replace(/,/g,''));
        totalPrice += priceNum * (item.quantity || 1);

        const card = document.createElement('div');
        card.className = 'shop-card cart-card';

        card.innerHTML = `
            <img src="${product.images[0]}" alt="${product.title}">
            <h3>${product.title}</h3>
            <p class="price">${product.price} x ${item.quantity || 1}</p>
        `;

        // ✅ REMOVE BUTTON (FIXED)
        const btn = document.createElement('button');
        btn.className = 'btn small-btn';
        btn.innerText = "Remove";

        btn.onclick = () => removeFromCart(item.uid);

        card.appendChild(btn);
        grid.appendChild(card);
    });

    container.innerHTML = '';
    container.appendChild(grid);

    const total = totalPrice + shippingCost;

    cartTotal.innerHTML = `
        <div class="cart-summary">
            <h3>Order Total</h3>
            <p>Subtotal: ₹${totalPrice}</p>
            <p>Shipping: ₹${shippingCost}</p>
            <h4>Total: ₹${total}</h4>
        </div>
    `;

    document.getElementById('subtotal-text').innerText = 'Subtotal: ₹' + totalPrice;
    document.getElementById('shipping-text').innerText = 'Shipping: ₹' + shippingCost;
    document.getElementById('total-text').innerText = 'Total: ₹' + total;

    checkoutPanel.classList.remove('hidden');
}


// ─── PLACE ORDER ───────────────────────────────────────────────────────────
async function placeOrder() {
    const cart = getCart();
    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    const paymentMethod = document.querySelector('input[name="payment-method"]:checked').value;

    const items = cart.map(item => {
        const product = productsData[item.id];
        return {
            name: product.title,
            price: Number(product.price.replace(/[^0-9.]/g, "")),
            quantity: item.quantity || 1,
            image: product.images[0]
        };
    });

    // Show loading message
    const placeOrderBtn = document.querySelector('button[onclick="placeOrder()"]');
    const originalText = placeOrderBtn.textContent;
    placeOrderBtn.textContent = "Processing...";
    placeOrderBtn.disabled = true;

    try {
        if (paymentMethod === 'online') {
            // Online Payment (Mock)
            const response = await fetch("http://localhost:5000/api/payments/create-checkout-session", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ items })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to create payment session.");
            }

            // Mock payment - simulate processing delay
            setTimeout(() => {
                alert('🎉 Payment successful! Your order has been placed.');
                localStorage.removeItem('elvora_cart');
                displayCart();
                placeOrderBtn.textContent = originalText;
                placeOrderBtn.disabled = false;
            }, 2000);
        } else {
            // Cash on Delivery
            const response = await fetch("http://localhost:5000/api/orders/cod", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ items })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to place order.");
            }

            alert('✅ Order placed successfully! Pay cash when you receive your delivery.');
            localStorage.removeItem('elvora_cart');
            displayCart();
            placeOrderBtn.textContent = originalText;
            placeOrderBtn.disabled = false;
        }

    } catch (err) {
        alert("Order error: " + err.message);
        placeOrderBtn.textContent = originalText;
        placeOrderBtn.disabled = false;
    }
}

function checkPaymentResult() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('success')) {
        alert('Payment successful! Your order has been placed.');
        localStorage.removeItem('elvora_cart');
        displayCart();
    }
    if (urlParams.get('canceled')) {
        alert('Payment was canceled. You can try again.');
    }
}

// ─── INIT ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    displayCart();
    checkPaymentResult();
});


// ─── LOGOUT ────────────────────────────────────────────────────────────────
function logoutUser() {
    localStorage.clear();
    alert('Logged out successfully!');
    window.location.href = 'home.html';
}
</script>
</body>
</html>
