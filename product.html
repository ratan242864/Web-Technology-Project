<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">ELVORA</div>

        <li><a href="home.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>

    <div class="nav-icons">

        <a href="cart.html" class="icon">🛒</a>

<!-- PRODUCT SECTION -->
<div class="container product-page">

    <div class="product-layout">

        <!-- LEFT: IMAGE -->
        <div class="product-image">
            <img id="main-img" src="" alt="">
        </div>

        <!-- RIGHT: DETAILS -->
        <div class="product-details">
            <h2 id="product-title"></h2>
            <p class="price" id="product-price"></p>

            <p id="product-desc"></p>

            <h4>Select Size:</h4>
            <div class="sizes">
                <button type="button" class="size-btn" data-size="S">S</button>
                <button type="button" class="size-btn" data-size="M">M</button>
                <button type="button" class="size-btn" data-size="L">L</button>
            </div>
            <p id="selected-size" class="selected-size-text">Selected size: <span>None</span></p>

            <div class="product-buttons">
             <button class="btn" onclick="addToCart(productId)">Add to Cart</button>
                <button class="btn" onclick="addToWishlist()">Add to Wishlist</button>
            </div>

        </div>

    </div>

</div>

const productId = params.get("id");

        desc: "Flirty and fun design."
    },
   
};

// LOAD PRODUCT
const product = productsData[productId];
let selectedSize = null;
const sizeButtons = document.querySelectorAll('.size-btn');
const selectedSizeText = document.getElementById('selected-size');

if(product){
    document.getElementById("main-img").src = product.image;
    document.getElementById("product-title").innerText = product.title;
    document.getElementById("product-price").innerText = product.price;
    document.getElementById("product-desc").innerText = product.desc;
}

sizeButtons.forEach(button => {
    button.addEventListener('click', () => {
        selectedSize = button.dataset.size;
        sizeButtons.forEach(btn => btn.classList.remove('selected'));
        button.classList.add('selected');
        selectedSizeText.querySelector('span').innerText = selectedSize;
    });
});

// ADD TO CART
function addToCart(productId) {

    if (!selectedSize) {
        alert("Please select a size first!");
        return;
    }

    let cart = JSON.parse(localStorage.getItem('elvora_cart')) || [];

    cart.push({
        id: productId,
        size: selectedSize,
        quantity: 1,
        uid: Date.now() + Math.random()
    });

    localStorage.setItem('elvora_cart', JSON.stringify(cart));

    alert("Added to cart!");
}
// ADD TO WISHLIST
function addToWishlist(){
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    if (!productId) {
        alert("Product ID missing!");
        return;
    }

    let wishlist = JSON.parse(localStorage.getItem("elvora_wishlist")) || [];

    if (!wishlist.includes(productId)) {
        wishlist.push(productId);
    }

    localStorage.setItem("elvora_wishlist", JSON.stringify(wishlist));

    alert("Added to wishlist!");
}
</script>
